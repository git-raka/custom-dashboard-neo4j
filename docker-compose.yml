name: neo4j-dashboard-local

services:
  neo4j:
    container_name: neo4j-enterprise
    image: neo4j:2026.02.3-enterprise
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
      NEO4J_AUTH_FILE: /run/secrets/neo4j_auth
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_conf:/config
      - neo4j_plugins:/plugins
    secrets:
      - neo4j_auth

secrets:
  neo4j_auth:
    file: ./secrets/neo4j_auth.txt

volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_conf:
  neo4j_plugins:
